version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartoutbox
      POSTGRES_USER: smartoutbox
      POSTGRES_PASSWORD: smartoutbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  sampleapi:
    build:
      context: .
      dockerfile: src/SmartOutbox.SampleApi/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smartoutbox;Username=smartoutbox;Password=smartoutbox
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "5000:80"

  worker:
    build:
      context: .
      dockerfile: src/SmartOutbox.Worker/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smartoutbox;Username=smartoutbox;Password=smartoutbox
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

volumes:
  postgres-data:
